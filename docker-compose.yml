services:
  timesheet:
    image: ghcr.io/gioixxx/timesheet:latest
    container_name: timesheet
    labels:
      - com.centurylinklabs.watchtower.scope=timesheet
    # Non pubblicata sull'host: la raggiunge solo Caddy, che fa da HTTPS sulla porta 3000.
    expose:
      - "3000"
    environment:
      DATABASE_URL: file:///data/timesheet.db
      # Il giorno corrente e le finestre settimanali sono calcolati nel fuso del processo:
      # deve coincidere con quello dell'utente, altrimenti dopo mezzanotte il server e il
      # browser sono su due giorni diversi.
      TZ: ${TZ:-Europe/Rome}
      AUTH_ENABLED: "true"
      AUTH_SECRET: ${AUTH_SECRET:-}
      IAPI_BASE_URL: ${IAPI_BASE_URL:-}
      IAPI_API_KEY: ${IAPI_API_KEY:-}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      EMAIL_IMAP_HOST: ${EMAIL_IMAP_HOST:-}
      EMAIL_IMAP_PORT: ${EMAIL_IMAP_PORT:-993}
      EMAIL_IMAP_USER: ${EMAIL_IMAP_USER:-}
      EMAIL_IMAP_PASSWORD: ${EMAIL_IMAP_PASSWORD:-}
      EMAIL_IMAP_MAILBOX: ${EMAIL_IMAP_MAILBOX:-INBOX}
      EMAIL_ALLOWED_SENDERS: ${EMAIL_ALLOWED_SENDERS:-}
    volumes:
      - timesheet-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # HTTPS davanti all'app: senza un secure context il browser nega il microfono e il cookie
  # di sessione Secure verrebbe scartato. Certificato Let's Encrypt via DNS-01 di DuckDNS.
  caddy:
    build: ./deploy/caddy
    image: timesheet-caddy
    container_name: timesheet-caddy
    ports:
      - "3000:3000"
    environment:
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN:?imposta DUCKDNS_TOKEN nel .env}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - timesheet
    restart: unless-stopped

volumes:
  timesheet-data:
  # Certificati e account ACME: persistono tra le ricreazioni, così non si richiede
  # un certificato nuovo a ogni deploy (Let's Encrypt ha limiti di frequenza).
  caddy-data:
  caddy-config:
